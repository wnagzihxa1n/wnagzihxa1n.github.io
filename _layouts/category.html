---
layout: default
---
<div class="container category-page">
  <div class="row">
  {% assign cat = page.category_filter %}
  {% assign matched_posts = site.posts | where_exp: "post", "post.categories contains cat" %}
  {% if matched_posts.size > 0 %}
    {% for post in matched_posts %}
      {% include article-content.html %}
    {% endfor %}
  {% else %}
    <div class="col col-12">
      <p>暂无文章</p>
    </div>
  {% endif %}
  </div>
</div>
